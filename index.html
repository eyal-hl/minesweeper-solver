<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Minesweeper Solver</h1>
    <p class="subtitle">Upload a screenshot to get mine probability overlays</p>
  </header>

  <main>
    <section id="upload-section" class="card">
      <div
        id="drop-zone"
        role="button"
        tabindex="0"
        aria-label="Upload minesweeper screenshot — drop here or tap to browse"
      >
        <div class="drop-icon">📷</div>
        <p class="drop-text">Drop screenshot here</p>
        <p class="drop-subtext">or tap to browse / use camera</p>
        <input
          type="file"
          id="file-input"
          accept="image/*"
          aria-hidden="true"
        >
      </div>
    </section>

    <div id="status" hidden aria-live="polite">
      <div class="spinner" role="status"></div>
      <p id="status-message">Analyzing board…</p>
    </div>

    <div id="error-banner" role="alert" hidden></div>

    <section id="result-section" hidden>
      <div id="result-summary"></div>
      <div class="canvas-wrapper">
        <canvas id="result-canvas"></canvas>
      </div>
      <button id="download-btn" class="btn-primary">Download Result</button>
      <button id="reset-btn" class="btn-secondary">Analyze Another</button>
    </section>
  </main>

  <footer>
    <p>100% client-side analysis · No data leaves your browser · <a href="https://github.com/eyal-hl/minesweeper-solver" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="js/local-analyzer.js"></script>
  <script src="js/cell-classifier.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
